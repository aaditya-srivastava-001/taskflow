<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">TaskFlow</div>

        <div class="nav-status">
            <span class="status-dot"></span>
            API Connected
        </div>
    </header>


    <main class="container">

        <section class="hero">
            <div>
                <h1>Task Dashboard</h1>
                <p>Manage your projects and tasks efficiently.</p>
            </div>

            <button id="openTaskModal" class="primary-btn">
                + Create Task
            </button>
        </section>


        <!-- STATISTICS -->

        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Todo</span>
                <strong id="todoTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>In Progress</span>
                <strong id="progressTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="doneTasks">0</strong>
            </div>

        </section>


        <!-- CONTROLS -->

        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="todo">Todo</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
            </select>

            <select id="priorityFilter">
                <option value="">All Priority</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <button id="refreshBtn" class="secondary-btn">
                Refresh
            </button>

        </section>


        <!-- TASK TABLE -->

        <section class="task-section">

            <div class="section-header">
                <h2>Tasks</h2>
                <span id="taskCount">0 tasks</span>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="taskTableBody">
                    </tbody>

                </table>

                <div id="emptyState" class="empty-state">
                    No tasks found.
                </div>

            </div>

        </section>

    </main>


    <!-- CREATE TASK MODAL -->

    <div id="taskModal" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Create Task</h2>

                <button id="closeModal" class="close-btn">
                    ×
                </button>

            </div>


            <form id="taskForm">

                <label>
                    Task Title

                    <input
                        type="text"
                        id="taskTitle"
                        required
                    >
                </label>


                <label>
                    Description

                    <textarea
                        id="taskDescription"
                        rows="3"
                    ></textarea>
                </label>


                <div class="form-row">

                    <label>
                        Priority

                        <select id="taskPriority">
                            <option value="high">High</option>
                            <option value="medium" selected>
                                Medium
                            </option>
                            <option value="low">Low</option>
                        </select>
                    </label>


                    <label>
                        Status

                        <select id="taskStatus">
                            <option value="todo" selected>
                                Todo
                            </option>

                            <option value="in_progress">
                                In Progress
                            </option>

                            <option value="done">
                                Done
                            </option>
                        </select>
                    </label>

                </div>


                <label>
                    Due Date

                    <input
                        type="date"
                        id="taskDueDate"
                    >
                </label>


                <label>
                    Project ID

                    <input
                        type="number"
                        id="projectId"
                        value="1"
                        min="1"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="primary-btn full-width"
                >
                    Create Task
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
